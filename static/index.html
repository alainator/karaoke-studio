<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Karaoke Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='12' r='8' fill='%23ffc94d'/%3E%3Crect x='14' y='18' width='4' height='12' rx='2' fill='%23ffc94d'/%3E%3C/svg%3E">
<style>
:root {
  --bg: #121016; --panel: #1c1922; --panel2: #25212d; --line: #34303d; --text: #f1edf6; --dim: #a39daf;
  --gold: #ffc94d; --gold-ink: #241a00; --ok: #5fd39a; --bad: #ff7a85; --info: #8fb6ff; --radius: 12px;
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { display: flex; align-items: center; gap: 18px; padding: 14px 20px; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: rgba(18,16,22,.92); backdrop-filter: blur(8px); z-index: 5; flex-wrap: wrap; }
header h1 { font-size: 18px; margin: 0; letter-spacing: .3px; display: flex; align-items: center; gap: 8px; }
header h1 span { color: var(--gold); }
header h1 a { color: inherit; text-decoration: none; display: flex; align-items: center; gap: 8px; }
a.back { display: inline-flex; align-items: center; gap: 6px; color: var(--dim); text-decoration: none; font-size: 14px; padding: 6px 10px 6px 0; }
a.back:hover { color: var(--gold); }
.detail-head { display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; margin-bottom: 4px; }
.detail-head h2 { margin: 0; }
nav { display: flex; gap: 4px; }
nav button { background: none; border: 0; color: var(--dim); padding: 8px 12px; border-radius: 8px; font: inherit; cursor: pointer; }
nav button.on { background: var(--panel2); color: var(--text); }
#gpu { margin-left: auto; color: var(--dim); font-size: 13px; }
main { max-width: 1100px; margin: 0 auto; padding: 20px 16px 60px; }
.view { display: none; } .view.on { display: block; }
form.search { display: flex; gap: 8px; }
input[type=text] { flex: 1; min-width: 0; background: var(--panel); border: 1px solid var(--line); color: var(--text); border-radius: 10px; padding: 12px 14px; font: inherit; font-size: 16px; }
input[type=text]:focus { outline: 2px solid var(--gold); outline-offset: -1px; }
button.primary, button.ghost { border-radius: 10px; padding: 10px 16px; font: inherit; font-weight: 600; cursor: pointer; border: 1px solid transparent; }
button.primary { background: var(--gold); color: var(--gold-ink); }
button.primary:disabled { opacity: .45; cursor: default; }
button.ghost { background: var(--panel2); color: var(--text); border-color: var(--line); font-weight: 500; }
button.danger { color: var(--bad); }
.hint { color: var(--dim); font-size: 13px; }
h2 { font-size: 15px; margin: 26px 0 10px; color: var(--dim); font-weight: 600; text-transform: uppercase; letter-spacing: .8px; }
.cols { display: grid; grid-template-columns: 3fr 2fr; gap: 20px; }
@media (max-width: 820px) { .cols { grid-template-columns: 1fr; } }
.list { display: flex; flex-direction: column; gap: 8px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; display: flex; gap: 12px; align-items: center; cursor: pointer; }
.card.sel { border-color: var(--gold); box-shadow: 0 0 0 1px var(--gold) inset; }
.card img { width: 120px; aspect-ratio: 16/9; object-fit: cover; border-radius: 8px; flex: none; background: #000; }
.card .t { font-weight: 600; overflow-wrap: anywhere; }
.card .m { color: var(--dim); font-size: 13px; }
.tag { display: inline-block; font-size: 11px; padding: 1px 7px; border-radius: 99px; margin-right: 4px; background: var(--panel2); color: var(--dim); }
.tag.good { background: rgba(95,211,154,.15); color: var(--ok); }
.tag.warn { background: rgba(255,122,133,.14); color: var(--bad); }
.makebar { position: sticky; bottom: 0; margin-top: 18px; background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.makebar input { flex: 1 1 160px; padding: 9px 12px; font-size: 15px; }
.jobs .card { cursor: pointer; }
.steps { display: flex; gap: 3px; margin-top: 6px; }
.steps i { height: 4px; flex: 1; border-radius: 4px; background: var(--line); }
.steps i.d { background: var(--gold); } .steps i.a { background: var(--gold); animation: pulse 1s infinite alternate; }
@keyframes pulse { to { opacity: .35; } }
.status { font-size: 12px; font-weight: 600; }
.status.done { color: var(--ok); } .status.failed { color: var(--bad); } .status.running, .status.queued { color: var(--info); }
.player { position: relative; background: #000; border-radius: var(--radius); overflow: hidden; }
.player video { width: 100%; display: block; aspect-ratio: 16/9; }
.controls { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 14px; margin-top: 14px; }
.ctl { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; }
.ctl label { display: flex; justify-content: space-between; font-size: 13px; color: var(--dim); margin-bottom: 6px; }
.ctl input[type=range] { width: 100%; accent-color: var(--gold); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { color: var(--dim); font-weight: 600; font-size: 12px; text-transform: uppercase; letter-spacing: .6px; }
td.n { text-align: right; font-variant-numeric: tabular-nums; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: var(--panel2); border: 1px solid var(--line); padding: 10px 16px; border-radius: 10px; max-width: 90vw; z-index: 20; display: none; }
.empty { color: var(--dim); padding: 30px; text-align: center; border: 1px dashed var(--line); border-radius: var(--radius); }
.pub { margin-top: 14px; }
.pub label.chk { display: flex; gap: 8px; align-items: center; justify-content: flex-start; font-size: 14px; margin: 8px 0 0; color: var(--text); flex-wrap: wrap; }
.lyr .t { font-size: 14px; }
.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--line); border-top-color: var(--gold); border-radius: 50%; animation: spin .8s linear infinite; vertical-align: -2px; }
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1><a href="#make">🎤 Karaoke <span>Studio</span></a></h1>
  <nav>
    <button data-v="make" class="on">Make</button>
    <button data-v="jobs">Songs</button>
    <button data-v="lib">Library</button>
  </nav>
  <div id="gpu"></div>
</header>
<main>
  <section id="v-make" class="view on">
    <form class="search" id="sform">
      <input type="text" id="q" placeholder="Artist - Title   (e.g. Linkin Park - Numb)" autocomplete="off">
      <button class="primary" id="sbtn">Search</button>
    </form>
    <p class="hint">Finds the official music video and timed lyrics. Pick one of each, then Make. English (Latin-letter) songs for now.</p>
    <div id="results"></div>
  </section>

  <section id="v-jobs" class="view">
    <div id="jobdetail"></div>
    <div id="jobsindex"><h2>Your songs</h2>
    <div class="list jobs" id="joblist"></div></div>
  </section>

  <section id="v-lib" class="view">
    <p class="hint">Everything in PiKaraoke, most-sung first. "Make MV version" starts a search for songs that only have a YouTube lyric video.</p>
    <div id="lib"></div>
  </section>
</main>
<div class="toast" id="toast"></div>

<script src="/static/octopus/subtitles-octopus.js"></script>
<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt = s => s == null ? "?" : `${Math.floor(s/60)}:${String(Math.round(s%60)).padStart(2,"0")}`;
async function api(path, opts = {}) {
  const r = await fetch(path, {headers: {"Content-Type": "application/json"}, ...opts});
  let body; try { body = await r.json(); } catch { body = {}; }
  if (!r.ok) throw new Error(body.detail || `HTTP ${r.status}`);
  return body;
}
function toast(msg, ms = 4500) { const t = $("#toast"); t.textContent = msg; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", ms); }

// ---------- tabs ----------
function show(v) {
  document.querySelectorAll("nav button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  document.querySelectorAll(".view").forEach(s => s.classList.toggle("on", s.id === "v-" + v));
  if (v === "jobs") loadJobs();
  if (v === "lib") loadLib();
  if (v !== "jobs") closePlayer();
}
document.querySelectorAll("nav button").forEach(b => b.onclick = () => { location.hash = b.dataset.v; });
window.onhashchange = () => {
  const [v, id] = location.hash.slice(1).split("/");
  show(v || "make");
  const detail = v === "jobs" && id;
  $("#jobsindex").style.display = detail ? "none" : "";
  if (detail) { openJob(id); window.scrollTo(0, 0); }
  else { closePlayer(); $("#jobdetail").innerHTML = ""; }
};

// ---------- status ----------
let FONTS = [];
async function status() {
  try {
    const s = await api("/api/status"); $("#gpu").textContent = `GPU ${s.gpu_free_gb} GB free`; FONTS = s.fonts || ["/static/octopus/Arial.ttf", "/static/octopus/DroidSansFallback.ttf"];
    if (s.renderer === false) toast("Lyrics preview needs the renderer: run  python get_renderer.py  on the server", 15000);
  } catch {}
}
const statusReady = status(); setInterval(status, 30000);

// ---------- search ----------
let pick = {video: null, lyr: null, data: null};
$("#sform").onsubmit = async e => {
  e.preventDefault();
  const q = $("#q").value.trim(); if (!q) return;
  $("#sbtn").disabled = true;
  $("#results").innerHTML = `<p class="hint"><span class="spinner"></span> Searching YouTube and LRCLIB…</p>`;
  try { pick = {video: null, lyr: null, data: await api("/api/search?q=" + encodeURIComponent(q))}; renderResults(); }
  catch (err) { $("#results").innerHTML = `<div class="empty">${esc(err.message)}</div>`; }
  $("#sbtn").disabled = false;
};
function bestLyrics(d, video) {
  const ok = d.lyrics.filter(l => l.timed && l.latin);
  if (!ok.length) return null;
  const dur = video ? video.duration : null;
  return ok.slice().sort((a, b) => (b.name_match - a.name_match) || (dur ? Math.abs(a.duration - dur) - Math.abs(b.duration - dur) : b.lines - a.lines))[0];
}
function renderResults() {
  const d = pick.data;
  if (!pick.video) pick.video = d.videos.find(v => !v.flags.length) || d.videos[0] || null;
  if (!pick.lyr) pick.lyr = bestLyrics(d, pick.video);
  const vids = d.videos.map(v => `
    <div class="card ${pick.video && pick.video.id === v.id ? "sel" : ""}" data-vid="${esc(v.id)}">
      <img src="${esc(v.thumb)}" alt="" loading="lazy">
      <div><div class="t">${esc(v.title)}</div>
      <div class="m">${esc(v.channel)} · ${fmt(v.duration)} · ${v.views ? (v.views/1e6).toFixed(v.views > 1e7 ? 0 : 1) + "M views" : ""}</div>
      <div>${v.official_channel ? '<span class="tag good">artist channel</span>' : ""}${v.verified && !v.official_channel ? '<span class="tag">verified</span>' : ""}${v.flags.map(f => `<span class="tag warn">${esc(f)}</span>`).join("")}
      <a class="tag" href="https://www.youtube.com/watch?v=${esc(v.id)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">watch ↗</a></div></div>
    </div>`).join("") || `<div class="empty">No videos found</div>`;
  const dur = pick.video ? pick.video.duration : null;
  const lyrs = d.lyrics.map(l => `
    <div class="card lyr ${pick.lyr && pick.lyr.id === l.id ? "sel" : ""}" data-l="${l.id}">
      <div><div class="t">${esc(l.artist)} – ${esc(l.title)}</div>
      <div class="m">${esc(l.album || "")} · ${fmt(l.duration)}${dur && l.duration ? ` (${l.duration - dur > 0 ? "+" : ""}${Math.round(l.duration - dur)}s vs video)` : ""}</div>
      <div>${l.timed ? `<span class="tag good">timed · ${l.lines} lines</span>` : '<span class="tag warn">not timed</span>'}${l.latin ? "" : '<span class="tag warn">non-Latin</span>'}</div>
      ${l.first ? `<div class="m">“${esc(l.first)}…”</div>` : ""}</div>
    </div>`).join("") || `<div class="empty">No lyrics found on LRCLIB</div>`;
  const canMake = pick.video && pick.lyr && pick.lyr.timed && pick.lyr.latin;
  $("#results").innerHTML = `
    <div class="cols">
      <div><h2>Music video</h2><div class="list">${vids}</div></div>
      <div><h2>Lyrics</h2><div class="list">${lyrs}</div></div>
    </div>
    <div class="makebar">
      <input type="text" id="artist" value="${esc(d.artist || "")}" placeholder="Artist">
      <input type="text" id="title" value="${esc(d.title || "")}" placeholder="Title">
      <button class="primary" id="make" ${canMake ? "" : "disabled"}>Make karaoke</button>
      <span class="hint">${canMake ? "about 1–2 minutes" : "pick a video and timed lyrics"}</span>
    </div>`;
  document.querySelectorAll("[data-vid]").forEach(c => c.onclick = () => { pick.video = d.videos.find(v => v.id === c.dataset.vid); pick.lyr = null; renderResults(); });
  document.querySelectorAll("[data-l]").forEach(c => c.onclick = () => { pick.lyr = d.lyrics.find(l => l.id == c.dataset.l); renderResults(); });
  $("#make").onclick = makeJob;
}
async function makeJob() {
  const artist = $("#artist").value.trim(), title = $("#title").value.trim();
  if (!artist || !title) return toast("Fill in artist and title");
  $("#make").disabled = true;
  try {
    const r = await api("/api/jobs", {method: "POST", body: JSON.stringify({yt: pick.video.id, lrc_id: pick.lyr.id, artist, title, video_title: pick.video.title})});
    location.hash = "jobs/" + r.id;
  } catch (e) { toast(e.message); $("#make").disabled = false; }
}

// ---------- jobs ----------
const STEP_NAMES = {queued: "Waiting", lyrics: "Getting lyrics", download: "Downloading video", separate: "Removing vocals", align: "Lining up lyrics", render: "Finishing", done: "Ready"};
let jobsTimer = null, currentJob = null;
function stepBar(j) {
  const order = ["lyrics", "download", "separate", "align", "render"];
  const k = j.status === "done" ? 99 : order.indexOf(j.step);
  return `<div class="steps">${order.map((s, i) => `<i class="${i < k ? "d" : i === k && j.status === "running" ? "a" : ""}"></i>`).join("")}</div>`;
}
function jobLine(j) {
  const st = j.status === "running" ? STEP_NAMES[j.step] || j.step : j.status === "queued" ? (j.waiting || "Waiting") : j.status === "failed" ? "Failed" : j.published ? "Published" : "Ready to preview";
  return `<div class="card" data-j="${esc(j.id)}">
    <img src="https://i.ytimg.com/vi/${esc(j.yt)}/mqdefault.jpg" alt="">
    <div style="flex:1"><div class="t">${esc(j.artist)} – ${esc(j.title)}</div>
    <div class="status ${esc(j.status)}">${esc(st)}</div>${j.status === "running" || j.status === "queued" ? stepBar(j) : ""}</div></div>`;
}
async function loadJobs() {
  clearTimeout(jobsTimer);
  try {
    const jobs = await api("/api/jobs");
    $("#joblist").innerHTML = jobs.map(jobLine).join("") || `<div class="empty">Nothing made yet. Search for a song on the Make tab.</div>`;
    document.querySelectorAll("[data-j]").forEach(c => c.onclick = () => location.hash = "jobs/" + c.dataset.j);
    if (jobs.some(j => j.status === "running" || j.status === "queued")) jobsTimer = setTimeout(loadJobs, 2500);
  } catch (e) { $("#joblist").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

// ---------- preview ----------
let octopus = null, vox = null, detailTimer = null;
function closePlayer() {
  clearTimeout(detailTimer);
  if (octopus) { try { octopus.dispose(); } catch {} octopus = null; }
  if (vox) { vox.pause(); vox = null; }
  currentJob = null;
}
const backLink = () => `<a class="back" href="#jobs">← All songs</a>`;
async function openJob(id) {
  if (currentJob !== id) closePlayer();
  currentJob = id;
  let j;
  try { j = await api("/api/jobs/" + id); } catch (e) { $("#jobdetail").innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
  if (currentJob !== id) return;
  if (j.status !== "done") {
    $("#jobdetail").innerHTML = `${backLink()}<h2>${esc(j.artist)} – ${esc(j.title)}</h2>
      <div class="ctl"><div class="status ${esc(j.status)}">${j.status === "failed" ? "Failed: " + esc(j.error) : esc(j.status === "queued" ? (j.waiting || "Waiting for its turn") : STEP_NAMES[j.step] || j.step)}</div>
      ${stepBar(j)}<div class="m hint" style="margin-top:8px">${j.log.map(esc).join("<br>")}</div>
      ${j.status === "failed" ? `<div class="row" style="margin-top:10px"><button class="ghost" id="retry">Try again</button><button class="ghost danger" id="del">Delete</button></div>` : ""}</div>`;
    if (j.status === "failed") { $("#retry").onclick = async () => { await api(`/api/jobs/${id}/retry`, {method: "POST"}); openJob(id); loadJobs(); }; $("#del").onclick = () => delJob(id); }
    else detailTimer = setTimeout(() => { openJob(id); loadJobs(); }, 2500);
    return;
  }
  if (document.getElementById("pv") && document.getElementById("pv").dataset.id === id) return renderPublish(id, j);
  const r = j.result || {};
  $("#jobdetail").innerHTML = `${backLink()}
    <h2>${esc(j.artist)} – ${esc(j.title)}</h2>
    <div class="player"><video id="pv" data-id="${esc(id)}" controls playsinline preload="auto" src="/api/jobs/${esc(id)}/file/video.mp4"></video></div>
    <div class="controls">
      <div class="ctl"><label><span>Guide vocals</span><span id="voxv">off</span></label><input type="range" id="voxr" min="0" max="100" value="0"></div>
      <div class="ctl"><label><span>Lyrics timing</span><span id="offv">${j.offset >= 0 ? "+" : ""}${(j.offset || 0).toFixed(2)} s</span></label>
        <input type="range" id="offr" min="-2" max="2" step="0.05" value="${j.offset || 0}">
        <div class="hint">Drag right if the words light up too early.</div></div>
      <div class="ctl"><div class="hint">${r.lines ?? "?"} lines · video ${esc(r.video || "")} · made in ${r.seconds ?? "?"} s${r.skipped && r.skipped.length ? `<br>Not sung in this video: ${r.skipped.map(s => "“" + esc(s) + "”").join(", ")}` : ""}</div></div>
    </div>
    <div class="ctl pub" id="pub"><span class="spinner"></span></div>`;
  const v = $("#pv");
  await statusReady;
  if (window.SubtitlesOctopus) octopus = new SubtitlesOctopus({video: v, subUrl: `/api/jobs/${id}/file/lyrics.ass?o=${j.offset}`, fonts: FONTS, workerUrl: "/static/octopus/subtitles-octopus-worker.js"});
  vox = new Audio(`/api/jobs/${id}/file/vocals.m4a`); vox.preload = "auto"; vox.volume = 0;
  const sync = () => { if (!vox) return; if (Math.abs(vox.currentTime - v.currentTime) > 0.12) vox.currentTime = v.currentTime; };
  v.addEventListener("play", () => { sync(); if (vox && vox.volume > 0) vox.play().catch(() => {}); });
  v.addEventListener("pause", () => vox && vox.pause());
  v.addEventListener("seeked", sync);
  v.addEventListener("timeupdate", sync);
  $("#voxr").oninput = e => { const x = e.target.value / 100; vox.volume = x; $("#voxv").textContent = x ? Math.round(x * 100) + "%" : "off"; if (x && !v.paused) { sync(); vox.play().catch(() => {}); } if (!x) vox.pause(); };
  let offTimer;
  $("#offr").oninput = e => {
    const o = parseFloat(e.target.value); $("#offv").textContent = (o >= 0 ? "+" : "") + o.toFixed(2) + " s";
    clearTimeout(offTimer);
    offTimer = setTimeout(async () => {
      try { await api(`/api/jobs/${id}/offset`, {method: "POST", body: JSON.stringify({offset: o})}); if (octopus) octopus.setTrackByUrl(`/api/jobs/${id}/file/lyrics.ass?o=${o}&t=${Date.now()}`); }
      catch (err) { toast(err.message); }
    }, 300);
  };
  renderPublish(id, j);
}
async function renderPublish(id, j) {
  let info; try { info = await api(`/api/jobs/${id}/publish-info`); } catch (e) { $("#pub").textContent = e.message; return; }
  const olds = info.old_versions.map(n => `<label class="chk"><input type="checkbox" class="old" value="${esc(n)}" checked> Remove the old YouTube version: <span class="hint">${esc(n)}</span></label>`).join("");
  $("#pub").innerHTML = `
    <div class="row" style="justify-content:space-between">
      <div><b>${j.published ? "Published" : "Publish to PiKaraoke"}</b> as <span class="hint">Music Videos/${esc(info.name)}</span>${info.exists && !j.published ? ' <span class="tag warn">replaces the existing one</span>' : ""}</div>
      <div class="row"><button class="primary" id="pubbtn">${j.published ? "Publish again" : "Publish"}</button><button class="ghost danger" id="del">Delete</button></div>
    </div>${olds}`;
  $("#pubbtn").onclick = async () => {
    $("#pubbtn").disabled = true;
    const remove = [...document.querySelectorAll(".old:checked")].map(c => c.value);
    try { const r = await api(`/api/jobs/${id}/publish`, {method: "POST", body: JSON.stringify({remove})}); toast(r.message + (r.removed.length ? ` · removed ${r.removed.length} old version(s)` : ""), 7000); loadJobs(); renderPublish(id, {...j, published: true}); }
    catch (e) { toast(e.message); $("#pubbtn").disabled = false; }
  };
  $("#del").onclick = () => delJob(id, j.published);
}
async function delJob(id, published) {
  if (!confirm(published ? "Delete the studio copy? The published song stays in PiKaraoke." : "Delete this song from the studio?")) return;
  try { await api("/api/jobs/" + id, {method: "DELETE"}); location.hash = "jobs"; loadJobs(); } catch (e) { toast(e.message); }
}

// ---------- library ----------
async function loadLib() {
  $("#lib").innerHTML = `<p class="hint"><span class="spinner"></span></p>`;
  try {
    const {songs} = await api("/api/library");
    $("#lib").innerHTML = songs.length ? `<table><thead><tr><th>Song</th><th>Kind</th><th class="n">Sung</th><th></th></tr></thead><tbody>${songs.map(s => `
      <tr><td>${esc(s.title)}</td>
      <td><span class="tag ${s.folder === "Music Videos" ? "good" : ""}">${esc(s.folder === "YouTube" ? "YouTube lyrics" : s.folder)}</span>${s.lyrics ? "" : ""}</td>
      <td class="n">${s.plays || ""}</td>
      <td>${s.folder === "YouTube" && !s.has_mv ? `<button class="ghost" data-q="${esc(s.query)}">Make MV version</button>` : s.has_mv ? '<span class="hint">has MV</span>' : ""}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">The library is empty</div>`;
    document.querySelectorAll("[data-q]").forEach(b => b.onclick = () => { $("#q").value = b.dataset.q; location.hash = "make"; $("#sform").requestSubmit(); });
  } catch (e) { $("#lib").innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

window.onhashchange();
</script>
</body>
</html>
